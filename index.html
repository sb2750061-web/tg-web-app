<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clicker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            user-select: none;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .score-box {
            font-size: 48px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #5288c1);
            margin: 20px 0;
        }
        /* Делаем кнопку из чистого CSS, она будет работать на 100% */
        .coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 0%, #f5b041 100%);
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active {
            transform: scale(0.90);
        }
        .footer-btn {
            margin-top: 40px;
            padding: 12px 24px;
            background-color: var(--tg-theme-destructive-text-color, #ec3b3b);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="welcome-user">Тапай монету!</h1>
    <div class="score-box" id="score-counter">0</div>
    
    <!-- Сама монета без капризных эмодзи -->
    <div class="coin-btn" id="click-coin"></div>

    <button class="footer-btn" id="close-app-btn">Выйти из игры</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const welcomeText = document.getElementById('welcome-user');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            welcomeText.innerText = `Тапай, ${tg.initDataUnsafe.user.first_name}!`;
        }

        let score = 0;
        const scoreCounter = document.getElementById('score-counter');
        const coinBtn = document.getElementById('click-coin');

        // Обрабатываем и клики, и быстрые тапы на телефонах
        const handleTap = (e) => {
            e.preventDefault();
            score++;
            scoreCounter.innerText = score;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        };

        coinBtn.addEventListener('click', handleTap);
        coinBtn.addEventListener('touchstart', handleTap);

        document.getElementById('close-app-btn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
